pluginGroup = io.github.shawndrash.pyprism
pluginName = PyPrism
pluginRepositoryUrl = https://github.com/shawndrash/PyPrism
pluginVersion = 0.1.0

# Target IDE for development: PyCharm Community.
# Python is built into PyCharm Community itself (not a separate plugin), so it
# satisfies <depends>com.intellij.modules.python</depends> out of the box.
# The published plugin runs on any IDE that provides com.intellij.modules.python:
# PyCharm Pro, PyCharm Community, or IntelliJ IDEA with the Python plugin.
platformType = PC
platformVersion = 2024.3.6

# Compatibility range. sinceBuild is 2024.3 (243). Bump on release as needed.
pluginSinceBuild = 243
pluginUntilBuild = 253.*

# Gradle JVM toolchain
javaVersion = 21

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
